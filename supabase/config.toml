# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "auya-website"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:8443"
additional_redirect_urls = ["http://localhost:8443/reset-password"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_confirmations = true

[storage]
file_size_limit = "5MiB"

# Called by pg_cron with a shared secret header, not by logged-in users.
[functions.process-emails]
verify_jwt = false
